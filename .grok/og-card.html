<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #07110c; overflow: hidden; }
  .stage { position: relative; width: 1200px; height: 630px; }
  svg { position: absolute; inset: 0; display: block; }
  .lockup {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px;
    transform: translateY(-2px);
  }
  h1 {
    margin: 0;
    font-family: "Liberation Serif", "DejaVu Serif", serif;
    font-weight: 700;
    font-size: 108px;
    line-height: 0.9;
    letter-spacing: 0.16em;
    color: #e2c27a;
    padding-left: 0.16em;
    text-shadow: 0 0 22px rgba(226, 194, 122, 0.28), 0 2px 0 rgba(7, 17, 12, 0.4);
  }
  .ornament { display: flex; align-items: center; gap: 10px; }
  .ornament i {
    width: 5px; height: 5px; border-radius: 50%; background: #e2c27a; display: block; opacity: 0.9;
  }
  .ornament span { width: 132px; height: 1px; background: #e2c27a; opacity: 0.8; display: block; }
  .sub {
    margin: 0;
    font-family: "Liberation Sans", "DejaVu Sans", sans-serif;
    font-weight: 400;
    font-size: 13px;
    letter-spacing: 0.46em;
    color: #e7f0e4;
    opacity: 0.82;
    padding-left: 0.46em;
  }
</style>
</head>
